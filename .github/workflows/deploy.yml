name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # data/ 与 public/assets/ 已入库，构建不需要再联网抓数据
      # 两个变量都指向仓库名：
      #   PAGES_BASE_PATH              → 供 next.config.ts 设置 basePath（构建期）
      #   NEXT_PUBLIC_PAGES_BASE_PATH  → 供 lib/students-data.ts 给素材路径加前缀
      #                                  （必须 NEXT_PUBLIC_ 前缀才会内联进客户端代码）
      - name: 构建静态站点
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
